  <text x="650" y="525" fill="#38bdf8" font-family="monospace" font-size="10">      designated-forwarder election preference 500 dont-preempt</text>
  <text x="650" y="545" fill="#38bdf8" font-family="monospace" font-size="10">   lacp system-id 00:1c:73:00:00:01</text>
  <text x="650" y="585" fill="#94a3b8" font-family="monospace" font-size="10">! Also synthesizes: Cisco Nexus NX-OS, Juniper Junos, FRRouting EVPN</text>
