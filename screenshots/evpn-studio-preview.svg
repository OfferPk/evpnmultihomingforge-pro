  <text x="650" y="400" fill="#64748b" font-family="monospace" font-size="10">! Arista EOS RFC 7432 / RFC 8365 EVPN All-Active Multihoming</text>
  <text x="650" y="420" fill="#c084fc" font-family="monospace" font-size="10">interface Port-Channel10</text>
  <text x="650" y="440" fill="#c084fc" font-family="monospace" font-size="10">   switchport mode trunk</text>
  <text x="650" y="460" fill="#c084fc" font-family="monospace" font-size="10">   evpn ethernet-segment</text>
  <text x="650" y="480" fill="#34d399" font-family="monospace" font-size="10">      identifier 01:00:1c:73:00:00:01:00:64:00</text>
