  <text x="650" y="262" fill="#38bdf8" font-family="monospace" font-size="10">0000:  01 19 00 01 c6 33 64 0b  00 01 01 00 1c 73 00 00  |.....3d......s..|</text>
  <text x="650" y="282" fill="#38bdf8" font-family="monospace" font-size="10">0010:  01 00 64 00 00 00 00 00  02 77 41                 |..d......wA     |</text>
  <text x="650" y="302" fill="#34d399" font-family="monospace" font-size="10">// RD: 198.51.100.11:1 | ESI: 01:00:1c:73:00:00:01:00:64:00 (Type 1)</text>
  <text x="650" y="322" fill="#34d399" font-family="monospace" font-size="10">// Tag ID: 0 (Per-ES Route) | Label/VNI: 10100 (BoS=1)</text>

