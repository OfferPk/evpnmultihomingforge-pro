<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchEvpn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#01030a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchEvpn)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    BGP EVPN Multihoming Architecture: Split-Brain Loop Hazard vs Zero-Trust All-Active Fabric
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hazardous: Loop-Prone Split-Brain Multihoming
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#020617" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Type 0 Arbitrary ESI &bull; Disabled Split-Horizon Filter</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Independent LACP IDs &bull; Modulo DF Flaps &bull; No Core Tracking</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC FABRIC FAILURE MODES:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Disabled split-horizon loops BUM broadcast packets back to CE</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; ESI byte mismatch breaks LACP aggregation; CE suspends member link</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Spine link failure causes silent blackholing without core-isolation tracking</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Modulo DF election causes multi-VLAN broadcast drops during leaf reboots</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">BROADCAST LOOP STORM &bull; CE LINK SUSPEND &bull; BLACKHOLE</text>

  <!-- Right: Hardened Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#061614" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: EVPNMultihomingForge Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#020617" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">RFC 7432 Type 1 LACP ESI &bull; Local Bias Split-Horizon</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">RFC 8584 Preference DF &bull; Core Isolation Tracking &bull; Type 1 Aliasing</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b16" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE ZERO-TRUST GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Local Bias hardware filtering completely eliminates BUM loopback</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Shared virtual LACP System ID enables standard IEEE 802.1AX LAG bonding</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Core isolation tracking drops access port if spines fail, redirecting traffic</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Sub-second convergence via Route Type 1 Mass Withdraw upon port failure</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">RFC 7432 &bull; RFC 8365 &bull; ARISTA, CISCO NEXUS &amp; JUNIPER</text>
</svg>
